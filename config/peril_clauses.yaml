# Clauses that MUST be evaluated for each peril, whatever Sonnet selects (README 8.2).
# Sonnet's clause selection is unioned with this list, so an exclusion can never be silently skipped.
# Only clauses that exist in the policy's product are used.
version: 1
always: [C-1.1, C-1.2, C-1.3, C-9.1, C-9.2]
perils:
  water_burst_or_leak: [C-2.1, C-2.2, C-2.3, C-2.4, C-8.1]
  flood_surface_water: [C-2.4, C-2.5, C-2.6]
  storm_wind_hail: [C-3.1, C-3.2, C-3.3, C-8.2]
  fire_smoke: [C-4.1, C-4.2]
  theft_burglary: [C-5.1, C-5.2, C-5.3, C-8.1]
  accidental_damage: [C-6.1]
